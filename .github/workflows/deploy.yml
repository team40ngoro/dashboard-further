name: CI/CD Pipeline to Internal Production (Self-Hosted Runner & PM2)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ==========================================
  # 1. CI STEP: Test & Validate Code (Cloud)
  # ==========================================
  test:
    name: Run Tests & Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Schema Migrations Check
        env:
          NODE_ENV: test
          DB_DRIVER: mock
        run: npm run migrate

      - name: Run Automated Test Suite
        env:
          NODE_ENV: test
          DB_DRIVER: mock
        run: npm test

  # ==========================================
  # 2. CD STEP: Deploy Locally on Internal Server
  # ==========================================
  deploy-internal:
    name: Deploy to Internal Server (10.68.8.219)
    needs: test
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy & Reload PM2 on Local Server
        env:
          HOME: /root
        run: |
          # 1. Pastikan environment HOME dan PATH tersedia untuk service runner
          export HOME="${HOME:-/root}"
          [ -z "$HOME" ] && export HOME="/root"
          export PATH="$PATH:/usr/local/bin:/usr/bin:/bin"
          
          echo "🚀 [CI/CD] Mulai proses deployment otomatis di server internal 10.68.8.219..."
          
          # 2. Bypass safe directory untuk Git (global & system)
          git config --global --add safe.directory '*' 2>/dev/null || true
          sudo git config --system --add safe.directory '*' 2>/dev/null || true
          
          # 3. Bersihkan path jika ada kata 'cd ' atau spasi ekstra
          RAW_PATH="${{ secrets.DEPLOY_PATH || '/opt/further-dashboard' }}"
          DEPLOY_DIR=$(echo "$RAW_PATH" | sed -e 's/^cd //' -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          
          if [ "$DEPLOY_DIR" = "/opt" ] || [ "$DEPLOY_DIR" = "/opt/" ] || [ -z "$DEPLOY_DIR" ]; then
            DEPLOY_DIR="/opt/further-dashboard"
          fi
          
          echo "📁 Target direktori deployment: $DEPLOY_DIR"
          
          # 4. Buat direktori dan pastikan kepemilikan user
          mkdir -p "$DEPLOY_DIR" 2>/dev/null || sudo mkdir -p "$DEPLOY_DIR"
          chown -R $(whoami) "$DEPLOY_DIR" 2>/dev/null || sudo chown -R $(whoami) "$DEPLOY_DIR" 2>/dev/null || true

          # Masuk ke direktori target
          cd "$DEPLOY_DIR"
          git config --global --add safe.directory "$DEPLOY_DIR" 2>/dev/null || true
          
          # 5. Sinkronisasi repository secara aman
          echo "📥 1. Mengambil dan menyinkronkan kode terbaru dari repository GitHub..."
          export GIT_DISCOVERY_ACROSS_FILESYSTEM=1
          
          if [ ! -d ".git" ]; then
            echo "🔧 Menginisialisasi ulang repositori Git di $DEPLOY_DIR..."
            rm -rf .git
            git init -b main
            git remote add origin https://github.com/team40ngoro/dashboard-further.git
          else
            git remote set-url origin https://github.com/team40ngoro/dashboard-further.git
          fi
          
          git fetch origin main --force
          git reset --hard origin/main
          git clean -fd
          
          echo "📦 2. Menginstal dependensi produksi..."
          npm ci --omit=dev
          
          echo "🔄 3. Menjalankan migrasi skema database..."
          npm run migrate
          
          echo "⚡ 4. Memuat ulang proses aplikasi dengan PM2..."
          if pm2 describe further-dashboard > /dev/null 2>&1; then
            pm2 reload further-dashboard --update-env
          else
            pm2 start ecosystem.config.js --env production || pm2 start server.js --name "further-dashboard"
          fi
          
          echo "💾 5. Menyimpan konfigurasi PM2..."
          pm2 save
          
          echo "🔍 6. Memeriksa status kesehatan server (Healthcheck)..."
          sleep 3
          HEALTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/health || echo "000")
          
          if [ "$HEALTH_STATUS" = "200" ]; then
            echo "✅ Healthcheck sukses (Status 200 OK)."
            echo "🎉 DEPLOYMENT BERHASIL! Aplikasi aktif dan siap melayani trafik di server 10.68.8.219."
          else
            echo "⚠️ Peringatan: Healthcheck mengembalikan status $HEALTH_STATUS."
          fi